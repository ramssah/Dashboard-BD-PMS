name: Capture tenders

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: capture
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run capture
        run: node run.mjs
      - name: Save the updated feed
        run: |
          git config user.name "tender-radar"
          git config user.email "tender-radar@users.noreply.github.com"
          git add feed.json
          git diff --cached --quiet || git commit -m "Update tender feed"
          git push
