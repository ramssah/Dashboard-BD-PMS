<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IQT BD and PMS</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed navy section sidebar (IQT nav), light/dark content area, one data store drives every view */
:root{
  --bg:#f3f5fa;--surface:#fff;--ink:#0f1b33;--muted:#5b6780;--line:#e1e6f0;--soft:#eef2f9;--accent:#1d63d6;--accent-ink:#fff;
  --good:#12805c;--good-bg:#e1f5ec;--warn:#9a6700;--warn-bg:#fdf1d0;--crit:#c2332f;--crit-bg:#fde4e2;
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--other:#9aa3b5;
  --nav:#0a1f44;--nav2:#102b5a;--navtext:#cfd9ee;
  --c-home:#2a78d6;--c-lead:#13808f;--c-bid:#5b49c9;--c-post:#17804c;--c-proj:#b8760a;--c-mis:#a3245f;
  --shadow:0 1px 2px rgba(15,27,51,.06),0 4px 14px rgba(15,27,51,.05);
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--head:'Space Grotesk','Inter',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1322;--surface:#141d33;--ink:#e8edf8;--muted:#9aa8c4;--line:#25304a;--soft:#1a2540;--accent:#5b9bff;--accent-ink:#06142e;
  --good:#3ccf99;--good-bg:#10382c;--warn:#f0b83a;--warn-bg:#3a2d0c;--crit:#ff7b76;--crit-bg:#431a1a;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;--other:#6c7790;
  --nav:#071430;--nav2:#0e2147;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1322;--surface:#141d33;--ink:#e8edf8;--muted:#9aa8c4;--line:#25304a;--soft:#1a2540;--accent:#5b9bff;--accent-ink:#06142e;
  --good:#3ccf99;--good-bg:#10382c;--warn:#f0b83a;--warn-bg:#3a2d0c;--crit:#ff7b76;--crit-bg:#431a1a;
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;--other:#6c7790;
  --nav:#071430;--nav2:#0e2147;--shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100%}
.side{background:var(--nav);color:var(--navtext);overflow-y:auto;padding:14px 12px 24px;scrollbar-width:thin}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 14px}
.logo{background:#fff;color:#0a1f44;font:700 17px var(--head);border-radius:9px;padding:9px 10px;letter-spacing:.5px}
.brand b{display:block;color:#fff;font:700 15px var(--head)}.brand span{font-size:10.5px;line-height:1.25;display:block;opacity:.8}
.grp{margin:8px 0 2px}
.grp>button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:9px;font:700 11.5px var(--font);letter-spacing:.06em;text-transform:uppercase;color:#fff;cursor:pointer;background:var(--gc)}
.grp>button:focus-visible,.nav a:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grp>button i{margin-left:auto;font-style:normal;opacity:.8;transition:transform .15s}.grp.closed>button i{transform:rotate(-90deg)}
.grp.closed .nav{display:none}
.nav{display:flex;flex-direction:column;padding:4px 0 2px}
.nav a{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--navtext);text-decoration:none;padding:7px 12px 7px 14px;border-radius:8px;font-size:13px;border-left:3px solid transparent}
.nav a:hover{background:var(--nav2)}.nav a.on{background:var(--nav2);color:#fff;border-left-color:var(--gc);font-weight:600}
.nav a em{font:500 10.5px var(--mono);font-style:normal;background:rgba(255,255,255,.12);border-radius:10px;padding:1px 7px;color:#fff}
.main{overflow-y:auto;min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px max(20px,env(safe-area-inset-right,0px)) 10px 20px;flex-wrap:wrap}
.crumb{font-size:12px;color:var(--muted);margin-right:auto;min-width:0}
.crumb b{color:var(--ink)}
.menu{display:none}
.content{padding:20px max(20px,env(safe-area-inset-right,0px)) 40px 20px;min-width:0}
.eyebrow{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
a{color:var(--accent)}
h1{font:700 28px/1.15 var(--head);margin:4px 0 4px;text-wrap:balance}
h2{font:700 15px var(--head);margin:0}
.sub{color:var(--muted);margin:0 0 16px;max-width:75ch}
.btn{font:600 12.5px var(--font);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--accent)}.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12px}.btn.danger{color:var(--crit)}
select,input,textarea{font:13px var(--font);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:7px 9px;border-radius:8px;max-width:100%}
textarea{width:100%;resize:vertical}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.card>header small{color:var(--muted);font-size:12px}
.grid{display:grid;gap:14px;margin-bottom:14px}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g32{grid-template-columns:minmax(0,1.1fr) minmax(0,1.4fr) minmax(0,1.2fr)}
.kpi{border-top:3px solid var(--kc,var(--accent))}.kpi small{font:600 10.5px var(--font);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kpi b{display:block;white-space:nowrap;font:700 26px/1.2 var(--head);margin:4px 0 2px}.kpi span{font-size:11.5px;color:var(--muted)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar .sp{margin-left:auto}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font:600 11px var(--font);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}.num{text-align:right;white-space:nowrap}
td .t{font-weight:600;max-width:340px}td small{color:var(--muted);display:block}
.pill{display:inline-block;align-self:flex-start;font:600 11px var(--font);padding:2px 9px;border-radius:20px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.crit{background:var(--crit-bg);color:var(--crit)}.pill.info{background:var(--soft);color:var(--accent)}
.prog{height:6px;background:var(--soft);border-radius:4px;min-width:70px}.prog i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.empty{color:var(--muted);padding:26px 8px;text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:6px}
svg text{fill:var(--muted);font:11px var(--font)}svg .v{fill:var(--ink);font-weight:600}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(210px,1fr);gap:10px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--soft);border-radius:10px;padding:8px;min-height:160px}.col.over{outline:2px dashed var(--accent)}
.col h3{font:700 11.5px var(--font);text-transform:uppercase;letter-spacing:.05em;margin:2px 4px 8px;display:flex;justify-content:space-between}
.tc{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 10px;margin-bottom:8px;cursor:grab;font-size:12.5px}
.tc b{display:block;margin-bottom:3px}.tc small{color:var(--muted)}
.modal{position:fixed;inset:0;background:rgba(5,12,28,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;overflow:auto}
.modal .box{background:var(--surface);border-radius:14px;padding:18px 20px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;margin:12px 0}.fg label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}.fg .w{grid-column:1/-1}
.fg input,.fg select{width:100%}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:9px;font-weight:600;z-index:30}
.note{background:var(--warn-bg);color:var(--warn);border-radius:9px;padding:9px 12px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk{display:flex;gap:8px;align-items:center;padding:5px 0}
.rng{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr 36px;gap:10px;align-items:center;padding:5px 0}.rng input{padding:0}
@media (max-width:1200px){.g6{grid-template-columns:repeat(3,minmax(0,1fr))}.g32{grid-template-columns:1fr 1fr}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}.side{position:fixed;inset:0 20% 0 0;z-index:15;transform:translateX(-100%);transition:transform .2s;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  body.nav-open .side{transform:none}.menu{display:inline-block}
  .g6,.g3,.g2,.g32{grid-template-columns:1fr 1fr}.content{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .top{padding-left:max(16px,env(safe-area-inset-left,0px))}h1{font-size:23px}
}
@media (max-width:520px){.g6,.g3,.g2,.g32,.fg{grid-template-columns:1fr}.rng{grid-template-columns:1fr 2fr 30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="app">
  <aside class="side" id="side" aria-label="Main navigation"></aside>
  <div class="main" id="main">
    <div class="top">
      <button class="btn menu" id="menuBtn" aria-label="Open menu">Menu</button>
      <div class="crumb" id="crumb"></div>
      <span id="feedStat" style="font-size:12px;color:var(--muted)"></span><button class="btn" data-act="syncNow">Refresh feed</button>
      <label for="fy" style="font-size:12px;color:var(--muted)">Financial year</label>
      <select id="fy"></select>
      <button class="btn" id="themeBtn">Theme</button>
      <button class="btn pri" id="exportBtn">Export data</button>
    </div>
    <div class="content" id="view"></div>
  </div>
</div>
<div id="modalRoot"></div>
<script>
"use strict";
/* ---------- constants ---------- */
const STAGES=[
 {k:'captured',n:'Captured'},{k:'verified',n:'Source verified'},{k:'reviewed',n:'IQT reviewed'},
 {k:'qualified',n:'Qualified'},{k:'go',n:'GO / Approved'},{k:'submitted',n:'Submitted'},{k:'won',n:'Won'}];
const OFF=[{k:'lost',n:'Lost'},{k:'nogo',n:'No-Go'},{k:'rejected',n:'Rejected'}];
const ALLST=STAGES.concat(OFF);
const SIDX=Object.fromEntries(STAGES.map((s,i)=>[s.k,i]));
const SNAME=Object.fromEntries(ALLST.map(s=>[s.k,s.n]));
const SECTORS=['Water Supply','Sewerage','Buildings','Township','Urban & Regional Development','Transport & Mobility','Agriculture & Rural Development','Climate & Sustainability','TA / PPP','Solid Waste Management','Unclassified'];
const REGIONS=['India','Africa','Asia','MENA','Europe','Americas','Other'];
const CRITERIA=[
 {k:'sector',n:'Sector fit with IQT credentials',w:3},{k:'geo',n:'Geography and local presence',w:2},
 {k:'size',n:'Contract size within our range',w:2},{k:'jv',n:'Partner or JV availability',w:1},
 {k:'cap',n:'Team capacity for the bid period',w:2},{k:'win',n:'Win probability and competition',w:3}];
const PSTAT=['Mobilisation','On Track','At Risk','Delayed','Completed'];
const KEY='iqt-bd-pms-v1';
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toISOString().slice(0,10);
const dd=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
const daysTo=d=>d?Math.round((new Date(d)-new Date(today()))/864e5):null;
const fmtD=d=>d?new Date(d).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}):'–';
const fmtN=n=>Number(n||0).toLocaleString('en-IN');

/* ---------- store ---------- */
let DB=null,FRESH=false;
function defaults(){return{tenders:[],projects:[],clients:{},fx:{INR:1,USD:88,EUR:95,GBP:111,KES:0.68},fy:'2026-27',sample:false,fyStart:4,log:[],feedUrl:'feed.json',deleted:{},feedSources:[],feedAt:''}}
function load(){
  try{const r=localStorage.getItem(KEY);if(r){DB=Object.assign(defaults(),JSON.parse(r));return}}catch(e){}
  DB=defaults();FRESH=true;
}
let saveT=null;
let SERVER=false;
function pushServer(){fetch('api/db',{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify(DB)}).catch(()=>{})}
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}if(SERVER)pushServer()},150)}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function inr(v,cur){return (Number(v)||0)*(DB.fx[cur||'INR']||1)}
function cr(v){const n=v/1e7;return '₹ '+(n>=100?n.toFixed(0):n.toFixed(2))+' Cr'}
function money(v,cur){return (cur||'INR')+' '+(v>=1e7&&cur==='INR'?(v/1e7).toFixed(2)+' Cr':fmtN(Math.round(v)))}

/* ---------- lifecycle: one source of truth ---------- */
function moveStage(t,to,note){
  const from=t.stage;if(from===to)return;
  t.stage=to;
  if(SIDX[to]!=null)t.reached=Math.max(t.reached||0,SIDX[to]);
  t.history=t.history||[];t.history.push({at:new Date().toISOString(),from,to,note:note||''});
  save();
}
function fitScore(t){
  let s=40;
  if(t.sector&&t.sector!=='Unclassified')s+=20;
  const hot=['Water Supply','Sewerage','Urban & Regional Development','TA / PPP','Township','Buildings'];
  if(hot.includes(t.sector))s+=15;
  if(['India','Africa','Asia'].includes(t.region))s+=10;
  if(t.rel==='HIGH')s+=15;else if(t.rel==='MEDIUM')s+=5;else if(t.rel==='LOW')s-=10;
  const v=inr(t.value,t.cur);if(v>=5e6&&v<=5e8)s+=10;else if(v>0)s+=3;
  const d=daysTo(t.deadline);if(d!=null&&d<0)s-=40;else if(d!=null&&d<5)s-=8;
  return Math.max(0,Math.min(100,s));
}
function goScore(t){
  const g=t.go&&t.go.scores;if(!g)return null;
  let tot=0,max=0;CRITERIA.forEach(c=>{tot+=(g[c.k]||0)*c.w;max+=5*c.w});
  return Math.round(tot/max*100);
}
function inFY(dateStr){
  if(!dateStr)return true;
  const [a]=DB.fy.split('-');const y0=+a;const d=new Date(dateStr);
  return d>=new Date(y0,3,1)&&d<new Date(y0+1,3,1);
}
const T=()=>DB.tenders.filter(t=>inFY(t.captured));
const cnt=(list,k)=>list.filter(t=>t.stage===k).length;
const reached=(list,i)=>list.filter(t=>(t.reached||0)>=i&&!(t.stage==='rejected'&&i>0)).length;
function sumBy(list,keyFn,valFn){const m={};list.forEach(t=>{const k=keyFn(t)||'Other';m[k]=(m[k]||0)+(valFn?valFn(t):1)});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
/* ---------- sample data (illustrative only) ---------- */
function seed(){
  let r=7;const rnd=()=>(r=(r*16807)%2147483647)/2147483647,pick=a=>a[Math.floor(rnd()*a.length)];
  const clients=[['Sample Water Board A','India','India','INR'],['Sample Municipal Corporation B','India','India','INR'],['Sample Development Bank C','Kenya','Africa','USD'],['Sample State Urban Agency D','India','India','INR'],['Sample County Government E','Kenya','Africa','KES'],['Sample UN Agency F','Nepal','Asia','USD'],['Sample Ministry of Works G','Ghana','Africa','USD'],['Sample Port Authority H','India','India','INR']];
  const subj=[['Water Supply','Water Supply Augmentation Scheme'],['Sewerage','Sewerage Network and STP'],['Buildings','Government Buildings Design Review'],['Urban & Regional Development','City Development Plan Preparation'],['Transport & Mobility','Urban Transport Master Plan'],['Transport & Mobility','Highway Corridor DPR'],['Agriculture & Rural Development','Agri Value Chain Study'],['Climate & Sustainability','Climate Resilience Assessment'],['TA / PPP','PPP Transaction Advisory'],['Solid Waste Management','Solid Waste Facility Project Management Consultancy'],['Township','New Township Master Planning']];
  const srcs=['World Bank STEP','GeM / CPPP','UNDP Procurement','State e-Procurement','AfDB Portal','Email alert'];
  const stagePlan=['captured','captured','captured','captured','captured','captured','verified','verified','verified','reviewed','reviewed','qualified','go','submitted','submitted','won','lost','nogo','rejected'];
  for(let i=0;i<46;i++){
    const c=pick(clients),s=pick(subj),st=stagePlan[Math.floor(rnd()*stagePlan.length)];
    const cap=dd(today(),-Math.floor(rnd()*70));
    const t={id:uid('T'),title:s[1]+' – Package '+(i+1),client:c[0],country:c[1],region:c[2],sector:rnd()<.12?'Unclassified':s[0],source:pick(srcs),
      url:'',value:Math.round((1+rnd()*40)*1e6/ (c[3]==='INR'?1:50))*(c[3]==='INR'?10:1),cur:c[3],captured:cap,deadline:dd(today(),Math.floor(rnd()*60)-8),
      stage:'captured',reached:0,owner:pick(['A. Rao','S. Mehta','K. Nair','R. Singh']),notes:'',history:[{at:new Date().toISOString(),from:'',to:'captured',note:'Sample record'}],sample:true};
    DB.tenders.push(t);
    const target=SIDX[st]!=null?SIDX[st]:(st==='lost'?5:st==='nogo'?3:1);
    for(let k=1;k<=target;k++){t.stage=STAGES[k].k;t.reached=k}
    if(['lost','nogo','rejected'].includes(st))t.stage=st;
    if(t.reached>=3)t.go={scores:{sector:3+Math.floor(rnd()*3),geo:3+Math.floor(rnd()*3),size:2+Math.floor(rnd()*4),jv:2+Math.floor(rnd()*4),cap:2+Math.floor(rnd()*4),win:2+Math.floor(rnd()*4)},decision:t.stage==='nogo'?'nogo':'go',reason:''};
    if(t.reached>=5||st==='lost')t.submission={date:dd(today(),-Math.floor(rnd()*30)),ref:'SUB-'+(100+i)};
    if(t.stage==='won')t.outcome={result:'won',date:dd(today(),-5),value:t.value,reason:'Sample'};
    if(t.stage==='lost')t.outcome={result:'lost',date:dd(today(),-9),value:0,reason:'Price'};
  }
  DB.projects=[
   mkP('Sample Township Design and PMC','Sample Municipal Corporation B','India','Township','A. Rao','On Track','Medium',200000000,35,-40,420),
   mkP('Sample County Transport Regulations','Sample County Government E','Kenya','Transport & Mobility','S. Mehta','On Track','Low',62000000,60,-110,150),
   mkP('Sample Water Augmentation Ward 33','Sample Water Board A','India','Water Supply','K. Nair','At Risk','Medium',48000000,75,-150,45),
   mkP('Sample STP Detailed Project Report','Sample State Urban Agency D','India','Sewerage','R. Singh','Delayed','High',85000000,48,-260,20),
   mkP('Sample Agri Value Chain Study','Sample Development Bank C','India','Agriculture & Rural Development','S. Mehta','Mobilisation','Low',31000000,10,-10,300)];
  DB.sample=true;
}
function mkP(name,client,country,sector,owner,status,risk,value,prog,startOff,endOff){
  const p={id:uid('P'),name,client,country,sector,owner,status,risk,value,progress:prog,start:dd(today(),startOff),end:dd(today(),endOff),pbgAmount:Math.round(value*0.05),pbgExpiry:dd(today(),endOff>100?200:Math.max(25,endOff)),
    milestones:[],invoices:[],sample:true};
  p.milestones=[['Inception report',-30,true],['Draft report',15,false],['Final report',endOff-20,false]].map(m=>({id:uid('M'),name:m[0],due:dd(today(),m[1]+(status==='Delayed'?-45:0)),done:m[2]}));

/* ---------- charts (inline SVG, theme tokens) ---------- */
const PAL=['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)','var(--s6)','var(--s7)','var(--s8)'];

function donut(data,centerTop,centerSub,colors){
  const top=data.slice(0,6),rest=data.slice(6).reduce((a,b)=>a+b[1],0);
  const rows=top.map((d,i)=>({n:d[0],v:d[1],c:(colors&&colors[i])||PAL[i]}));if(rest>0)rows.push({n:'Other',v:rest,c:'var(--other)'});
  const tot=rows.reduce((a,b)=>a+b.v,0);
  if(!tot)return '<div class="empty">No classified data yet.</div>';
  let a0=-Math.PI/2;const R=62,r=40;const arcs=rows.map(x=>{const a1=a0+x.v/tot*Math.PI*2-(rows.length>1?.02:0);const lg=a1-a0>Math.PI?1:0;
    const p=[Math.cos(a0)*R,Math.sin(a0)*R,Math.cos(a1)*R,Math.sin(a1)*R,Math.cos(a1)*r,Math.sin(a1)*r,Math.cos(a0)*r,Math.sin(a0)*r];a0+=x.v/tot*Math.PI*2;
    return `<path d="M${p[0]},${p[1]}A${R},${R} 0 ${lg} 1 ${p[2]},${p[3]}L${p[4]},${p[5]}A${r},${r} 0 ${lg} 0 ${p[6]},${p[7]}Z" fill="${x.c}"><title>${esc(x.n)}: ${x.v}</title></path>`}).join('');
  return `<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap"><svg viewBox="-70 -70 140 140" width="150" height="150" role="img" aria-label="Share chart">${arcs}<text class="v" text-anchor="middle" y="2" style="font-size:18px">${centerTop}</text><text text-anchor="middle" y="16" style="font-size:8px">${esc(centerSub||'')}</text></svg>${legend(rows.map(x=>({n:x.n,c:x.c,v:x.v})))}</div>`;
}
function hbars(data,max,colorFn){
  if(!data.length)return '<div class="empty">No data yet.</div>';
  const m=max||Math.max(...data.map(d=>d[1]),1);
  return data.map((d,i)=>`<div style="display:grid;grid-template-columns:minmax(80px,1.2fr) minmax(50px,1.6fr) auto;gap:8px;align-items:center;padding:4px 0;font-size:12.5px"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(d[0])}">${esc(d[0])}</span><div class="prog"><i style="width:${Math.max(2,d[1]/m*100)}%;background:${colorFn?colorFn(i):'var(--s1)'}"></i></div><b style="text-align:right;white-space:nowrap">${d[2]!=null?d[2]:fmtN(d[1])}</b></div>`).join('');
}
function funnel(list){

}
function monthly(list){
  const now=new Date(),months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({y:d.getFullYear(),m:d.getMonth(),l:d.toLocaleString('en',{month:'short'}),a:0,s:0,w:0,cur:i===0})}
  const idx=(ds)=>{const d=new Date(ds);return months.findIndex(x=>x.y===d.getFullYear()&&x.m===d.getMonth())};
  list.forEach(t=>{let i=idx(t.captured);if(i>=0)months[i].a++;if(t.submission){i=idx(t.submission.date);if(i>=0)months[i].s++}if(t.outcome&&t.outcome.result==='won'){i=idx(t.outcome.date);if(i>=0)months[i].w++}});
  const mx=Math.max(1,...months.map(x=>Math.max(x.a,x.s,x.w))),W=420,H=170,L=30,B=24,px=i=>L+8+i*(W-L-30)/5,py=v=>H-B-v/mx*(H-B-12);
  const line=(k,c)=>`<polyline fill="none" stroke="${c}" stroke-width="2" points="${months.map((x,i)=>px(i)+','+py(x[k])).join(' ')}"/>`+months.map((x,i)=>`<circle cx="${px(i)}" cy="${py(x[k])}" r="3.5" fill="${c}" stroke="var(--surface)" stroke-width="2"${x.cur?' opacity=".55"':''}><title>${x.l}: ${x[k]}</title></circle>`).join('');
  const grid=[0,.5,1].map(f=>`<line x1="${L}" x2="${W-6}" y1="${py(mx*f)}" y2="${py(mx*f)}" stroke="var(--line)"/><text x="${L-6}" y="${py(mx*f)+4}" text-anchor="end">${Math.round(mx*f)}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Monthly captures, submissions and awards">${grid}${months.map((x,i)=>`<text x="${px(i)}" y="${H-6}" text-anchor="middle">${x.l}${x.cur?'*':''}</text>`).join('')}${line('a','var(--s1)')}${line('s','var(--s3)')}${line('w','var(--s2)')}</svg>${legend([{n:'Captured',c:'var(--s1)'},{n:'Submitted',c:'var(--s3)'},{n:'Won',c:'var(--s2)'}])}<small style="color:var(--muted)">* Current month, still in progress.</small>`;
}

function parseCSV(s){
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<s.length;i++){const c=s[i];
    if(q){if(c==='"'&&s[i+1]==='"'){cell+='"';i++}else if(c==='"')q=false;else cell+=c}
    else if(c==='"')q=true;else if(c===','||c==='\t'){row.push(cell);cell=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()))rows.push(row);row=[]}
    else cell+=c}
  row.push(cell);if(row.some(x=>x.trim()))rows.push(row);return rows;
}
function importCSV(text){

  const col={title:ix(['title','tender','name','description']),client:ix(['client','agency','authority']),country:ix(['country']),region:ix(['region']),sector:ix(['sector']),source:ix(['source']),url:ix(['url','link']),value:ix(['value','amount','estimate']),cur:ix(['currency','cur']),deadline:ix(['deadline','due','closing'])};
  if(col.title<0){toast('No title column found. Add a header named title.');return}
  const seen=new Set(DB.tenders.map(t=>(t.title+'|'+t.client).toLowerCase()));let add=0,skip=0;
  rows.slice(1).forEach(r=>{const g=k=>col[k]>=0?(r[col[k]]||'').trim():'';const title=g('title');if(!title)return;
    const key=(title+'|'+g('client')).toLowerCase();if(seen.has(key)){skip++;return}seen.add(key);
    const sector=SECTORS.find(s=>s.toLowerCase()===g('sector').toLowerCase())||'Unclassified';const region=REGIONS.find(s=>s.toLowerCase()===g('region').toLowerCase())||(/india/i.test(g('country'))?'India':'Other');
    const cur=Object.keys(DB.fx).includes(g('cur').toUpperCase())?g('cur').toUpperCase():'INR';
    const dl=g('deadline');DB.tenders.push({id:uid('T'),title,client:g('client'),country:g('country'),region,sector,source:g('source')||'CSV import',url:g('url'),value:+(g('value').replace(/,/g,''))||0,cur,deadline:/^\d{4}-\d{2}-\d{2}$/.test(dl)?dl:'',captured:today(),stage:'captured',reached:0,owner:'',notes:'',history:[{at:new Date().toISOString(),from:'',to:'captured',note:'CSV import'}]});add++});
  save();render();toast(add+' added, '+skip+' duplicates skipped');
}

/* ---------- Lead management ---------- */
let F={q:'',stage:'',sector:'',region:''};
CHG.fq=(_,v)=>{F.q=v;render();const i=$('#fq');if(i){i.focus();i.setSelectionRange(v.length,v.length)}};
CHG.fs=(_,v)=>{F.stage=v;render()};CHG.fsec=(_,v)=>{F.sector=v;render()};CHG.freg=(_,v)=>{F.region=v;render()};
function filt(list){return list.filter(t=>(!F.q||(t.title+' '+t.client+' '+t.country).toLowerCase().includes(F.q.toLowerCase()))&&(!F.stage||t.stage===F.stage)&&(!F.sector||t.sector===F.sector)&&(!F.region||t.region===F.region))}
function filterBar(stages){return `<div class="bar"><input id="fq" data-inp="fq" value="${esc(F.q)}" placeholder="Search title, client, country" aria-label="Search" style="min-width:220px">${stages?`<select data-chg="fs" aria-label="Stage"><option value="">All stages</option>${opts(stages,F.stage)}</select>`:''}<select data-chg="fsec" aria-label="Sector"><option value="">All sectors</option>${opts(SECTORS,F.sector)}</select><select data-chg="freg" aria-label="Region"><option value="">All regions</option>${opts(REGIONS,F.region)}</select></div>`}
V.intel=()=>{
  const l=filt(T());
  return head('Lead management','Tender Intelligence','Every captured notice, in one register. Add tenders by hand or import them from a CSV your capture tools produce.')+
  `<div class="bar"><button class="btn pri" data-act="addTender">Add tender</button><button class="btn" data-act="importOpen">Import CSV</button><span class="sp" style="color:var(--muted)">${l.length} of ${T().length} shown</span></div>${filterBar(ALLST)}
  <div class="card">${table([{h:'Tender',f:tenderCell},{h:'Sector',f:t=>esc(t.sector)},{h:'Value',num:1,f:t=>t.value?esc(t.cur)+' '+fmtN(t.value):'–'},{h:'Deadline',f:t=>fmtD(t.deadline)+'<br>'+pillDue(t.deadline)},{h:'Fit',num:1,f:t=>fitScore(t)},{h:'Stage',f:t=>pillStage(t.stage)},{h:'',f:t=>`<button class="btn sm" data-act="editTender" data-id="${t.id}">Edit</button> <button class="btn sm danger" data-act="delTender" data-id="${t.id}">Delete</button>`}],l.slice(0,300),'No tenders match. Add one or import a CSV.')}${l.length>300?'<p style="color:var(--muted)">Showing the first 300. Narrow the filters to see more.</p>':''}</div>`;
};
CHG.setSector=(id,v)=>{DB.tenders.find(t=>t.id===id).sector=v;save();render()};
CHG.setRegion=(id,v)=>{DB.tenders.find(t=>t.id===id).region=v;save();render()};
V.identified=()=>{
  const l=filt(T().filter(t=>t.stage==='captured'));
  return head('Lead management','Opportunity Identified','New notices waiting for classification. Set the sector and region from the full scope, then send them to verification.')+filterBar()+
  `<div class="card"><header><h2>Unclassified or unreviewed</h2><small>${l.length} records</small></header>${table([{h:'Tender',f:tenderCell},{h:'Sector',f:t=>`<select data-chg="setSector" data-id="${t.id}" aria-label="Sector">${opts(SECTORS,t.sector)}</select>`},{h:'Region',f:t=>`<select data-chg="setRegion" data-id="${t.id}" aria-label="Region">${opts(REGIONS,t.region)}</select>`},{h:'Deadline',f:t=>pillDue(t.deadline)},{h:'',f:t=>`<button class="btn sm" data-act="toVerify" data-id="${t.id}">Send to verification</button>`}],l.slice(0,200),'Nothing waiting. New captures appear here.')}</div>`;
};
ACT.toVerify=id=>{location.hash='#verification'};
V.verification=()=>{
  const q=queue(),old=T().filter(t=>t.stage==='captured').length-q.length;
  return head('Lead management','Tender Verification','Open the official notice, confirm the details and record where you confirmed them. The queue is ranked by fit and time left.')+
  `<div class="grid g3">${kpi('Waiting for verification',q.length,'Still open for bids','var(--c-lead)')}${kpi('Expired unverified',old,'Deadline passed before review','var(--s8)')}${kpi('Verified so far',T().filter(t=>SIDX[t.stage]>=1).length,'With source evidence','var(--s3)')}</div>
  <div class="card">${table([{h:'#',f:t=>q.indexOf(t)+1},{h:'Tender',f:tenderCell},{h:'Fit',num:1,f:t=>fitScore(t)},{h:'Deadline',f:t=>fmtD(t.deadline)+'<br>'+pillDue(t.deadline)},{h:'Source',f:t=>t.url?`<a href="${esc(t.url)}" target="_blank" rel="noopener">Open notice</a>`:'<span class="pill warn">No link</span>'},{h:'',f:t=>`<button class="btn sm pri" data-act="verify" data-id="${t.id}">Verify</button> <button class="btn sm danger" data-act="reject" data-id="${t.id}">Reject</button>`}],q.slice(0,100),'The queue is clear.')}</div>`;
};
ACT.verify=id=>{const t=DB.tenders.find(x=>x.id===id);
  modal('Verify tender',`<p style="color:var(--muted);margin:6px 0">${esc(t.title)}</p><div class="fg"><label class="w">Official source link<input id="v_url" value="${esc(t.url)}" placeholder="https://"></label><label class="w">What did you confirm?<textarea id="v_note" rows="2" placeholder="Deadline, scope and eligibility match the official notice"></textarea></label></div>`,()=>{const u=$('#v_url').value.trim();if(!u){toast('Add the official source link');return false}t.url=u;t.verifiedBy=t.owner||'';moveStage(t,'verified',$('#v_note').value);render();toast('Verified')},'Mark verified')};
ACT.reject=id=>{const t=DB.tenders.find(x=>x.id===id);
  modal('Reject tender',`<p style="color:var(--muted);margin:6px 0">${esc(t.title)}</p><div class="fg"><label class="w">Reason<select id="r_why">${opts(['Out of scope','Duplicate','Not eligible','Already closed','Other'])}</select></label></div>`,()=>{moveStage(t,'rejected',$('#r_why').value);render()},'Reject')};
V.register=()=>{
  const l=filt(T().filter(t=>SIDX[t.stage]>=1&&!['lost','nogo','rejected'].includes(t.stage)));
  return head('Lead management','Opportunity Register','The clean list: verified opportunities only. Mark IQT review and qualification here before a bid decision.')+filterBar(STAGES.slice(1))+
  `<div class="card">${table([{h:'Opportunity',f:tenderCell},{h:'Sector',f:t=>esc(t.sector)},{h:'Value (INR)',num:1,f:t=>t.value?cr(inr(t.value,t.cur)):'–'},{h:'Deadline',f:t=>pillDue(t.deadline)},{h:'Stage',f:t=>pillStage(t.stage)},{h:'Next',f:t=>nextBtn(t)}],l,'No verified opportunities yet. Verify tenders first.')}</div>`;
};
function nextBtn(t){const m={verified:['reviewed','Mark IQT reviewed'],reviewed:['qualified','Mark qualified']}[t.stage];
  return m?`<button class="btn sm" data-act="adv" data-id="${t.id}" data-to="${m[0]}">${m[1]}</button>`:`<a href="#eligibility">Go / No-Go</a>`}
ACT.adv=(id,el)=>{const t=DB.tenders.find(x=>x.id===id);moveStage(t,el.dataset.to);render()};
/* pipeline board */
const BCOLS=['reviewed','qualified','go','submitted','won','lost'];
V.pipeline=()=>{
  const t=filt(T());
  return head('Lead management','Bid Pipeline','Drag a card to move it, or use the stage menu. Every move is recorded in the stage history.')+filterBar()+
  `<div class="board">${BCOLS.map(k=>{const l=t.filter(x=>x.stage===k);return `<div class="col" data-col="${k}"><h3><span>${SNAME[k]}</span><span>${l.length}</span></h3>${l.map(x=>`<div class="tc" draggable="true" data-card="${x.id}"><b>${esc(x.title)}</b><small>${esc(x.client)}</small><div style="display:flex;justify-content:space-between;gap:6px;align-items:center;margin-top:6px">${pillDue(x.deadline)}<select data-chg="mv" data-id="${x.id}" aria-label="Move stage">${opts(ALLST.filter(s=>s.k!=='captured'),x.stage)}</select></div></div>`).join('')||'<small style="color:var(--muted);padding:6px">Empty</small>'}</div>`}).join('')}</div>`;
};
CHG.mv=(id,v)=>{const t=DB.tenders.find(x=>x.id===id);if(v==='won'&&!t.outcome)t.outcome={result:'won',date:today(),value:t.value,reason:''};if(v==='lost'&&!t.outcome)t.outcome={result:'lost',date:today(),value:0,reason:''};if(v==='submitted'&&!t.submission)t.submission={date:today(),ref:''};moveStage(t,v,'Moved on pipeline');render()};
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-card]');if(c)e.dataTransfer.setData('text/plain',c.dataset.card)});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-col]');if(c){e.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('[data-col]');if(c)c.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-col]');if(!c)return;e.preventDefault();CHG.mv(e.dataTransfer.getData('text/plain'),c.dataset.col)});
/* ---------- Bid management ---------- */
V.eligibility=()=>{
  const l=T().filter(t=>['reviewed','qualified','go','nogo'].includes(t.stage));
  return head('Bid management','Eligibility & Go / No-Go','Score each opportunity against six weighted criteria. A score of 65 or more suggests Go. The decision and reason are saved with the tender.')+
  `<div class="card">${table([{h:'Opportunity',f:tenderCell},{h:'Deadline',f:t=>pillDue(t.deadline)},{h:'Stage',f:t=>pillStage(t.stage)},{h:'Score',num:1,f:t=>{const s=goScore(t);return s==null?'–':`<span class="pill ${s>=65?'good':s>=45?'warn':'crit'}">${s}</span>`}},{h:'Decision',f:t=>t.go&&t.go.decision?esc(t.go.decision==='go'?'Go':'No-Go')+(t.go.reason?`<small>${esc(t.go.reason)}</small>`:''):'Pending'},{h:'',f:t=>`<button class="btn sm pri" data-act="score" data-id="${t.id}">${t.go?'Review':'Score'}</button>`}],l,'No reviewed opportunities yet. Mark tenders as IQT reviewed in the register.')}</div>`;
};
window.updScore=()=>{let tot=0,max=0;CRITERIA.forEach(c=>{const v=+$('#sc_'+c.k).value;$('#sv_'+c.k).textContent=v;tot+=v*c.w;max+=5*c.w});const s=Math.round(tot/max*100);const e=$('#scTot');e.textContent=s+' / 100';e.className='pill '+(s>=65?'good':s>=45?'warn':'crit')};
ACT.score=id=>{const t=DB.tenders.find(x=>x.id===id);const g=(t.go&&t.go.scores)||{};
  const body=`<p style="color:var(--muted);margin:6px 0">${esc(t.title)}</p>${CRITERIA.map(c=>`<div class="rng"><label for="sc_${c.k}">${esc(c.n)}</label><input type="range" id="sc_${c.k}" min="1" max="5" value="${g[c.k]||3}" oninput="updScore()"><b id="sv_${c.k}">${g[c.k]||3}</b></div>`).join('')}<div style="display:flex;gap:10px;align-items:center;margin:8px 0">Total <span class="pill" id="scTot">0</span></div><div class="fg"><label class="w">Reason for the decision<textarea id="sc_reason" rows="2">${esc(t.go&&t.go.reason)}</textarea></label><label class="w">Decision<select id="sc_dec"><option value="go">Go, prepare a proposal</option><option value="nogo"${t.go&&t.go.decision==='nogo'?' selected':''}>No-Go, drop this bid</option></select></label></div>`;
  modal('Eligibility and Go / No-Go',body,()=>{const sc={};CRITERIA.forEach(c=>sc[c.k]=+$('#sc_'+c.k).value);const dec=$('#sc_dec').value;
    t.go={scores:sc,decision:dec,reason:$('#sc_reason').value.trim()};
    if(dec==='go'){if(SIDX[t.stage]<3)moveStage(t,'qualified','Scored');moveStage(t,'go',t.go.reason)}else moveStage(t,'nogo',t.go.reason);
    render();toast(dec==='go'?'Approved for proposal':'Marked No-Go')},'Save decision');
  updScore();
};
const PCHK=[['tech','Technical proposal'],['fin','Financial proposal'],['forms','Forms and declarations'],['jv','JV or partner agreements'],['review','Internal review sign-off']];
V.proposal=()=>{
  const l=T().filter(t=>t.stage==='go').sort((a,b)=>(a.deadline||'9').localeCompare(b.deadline||'9'));
  return head('Bid management','Proposal Preparation','Bids approved to proceed, soonest deadline first. Tick each part as it is ready.')+
  `<div class="grid g2">${l.map(t=>{const p=t.prop||{},n=PCHK.filter(c=>p[c[0]]).length;return `<div class="card"><header><h2>${esc(t.title)}</h2>${pillDue(t.deadline)}</header><small style="color:var(--muted)">${esc(t.client)} · Owner ${esc(t.owner||'unassigned')}</small><div class="prog" style="margin:10px 0"><i style="width:${n/PCHK.length*100}%"></i></div>${PCHK.map(c=>`<label class="chk"><input type="checkbox" data-chg="chk" data-id="${t.id}|${c[0]}"${p[c[0]]?' checked':''}> ${c[1]}</label>`).join('')}<div class="bar" style="margin:10px 0 0"><button class="btn sm pri" data-act="submitBid" data-id="${t.id}"${n<PCHK.length?'':''}>Record submission</button><small style="color:var(--muted)">${n} of ${PCHK.length} ready</small></div></div>`}).join('')||'<div class="card empty">No approved bids. Approve one in Eligibility & Go / No-Go.</div>'}</div>`;
};
CHG.chk=(key,v,el)=>{const [id,k]=key.split('|');const t=DB.tenders.find(x=>x.id===id);t.prop=t.prop||{};t.prop[k]=el.checked;save();render()};
ACT.submitBid=id=>{const t=DB.tenders.find(x=>x.id===id);
  modal('Record submission',`<div class="fg"><label>Submitted on<input id="s_date" type="date" value="${today()}"></label><label>Reference<input id="s_ref" value="${esc(t.submission&&t.submission.ref)}"></label><label class="w">Expected decision date<input id="s_exp" type="date" value="${dd(today(),60)}"></label></div>`,()=>{t.submission={date:$('#s_date').value||today(),ref:$('#s_ref').value.trim(),expected:$('#s_exp').value};moveStage(t,'submitted','Submitted');render();toast('Submission recorded')},'Save')};
V.submission=()=>{
  const l=T().filter(t=>t.stage==='submitted'),ready=T().filter(t=>t.stage==='go');
  return head('Bid management','Submission Tracking','Submitted bids and the date each client decision is due.')+
  `<div class="grid g3">${kpi('Ready to submit',ready.length,'Approved, not yet sent','var(--s4)')}${kpi('Submitted, awaiting',l.length,'Client decision pending','var(--s7)')}${kpi('Submitted value',cr(l.reduce((a,t)=>a+inr(t.value,t.cur),0)),'At your set exchange rates','var(--s3)')}</div>
  <div class="card">${table([{h:'Bid',f:tenderCell},{h:'Reference',f:t=>esc(t.submission&&t.submission.ref||'–')},{h:'Submitted',f:t=>fmtD(t.submission&&t.submission.date)},{h:'Decision due',f:t=>fmtD(t.submission&&t.submission.expected)+(t.submission&&t.submission.expected?'<br>'+pillDue(t.submission.expected):'')},{h:'',f:t=>`<button class="btn sm pri" data-act="outcome" data-id="${t.id}">Record outcome</button>`}],l,'No submitted bids yet.')}</div>`;
};
V.award=()=>{
  const t=T(),w=t.filter(x=>x.stage==='won'),lo=t.filter(x=>x.stage==='lost'),dec=w.length+lo.length;
  const why=sumBy(lo,x=>x.outcome&&x.outcome.reason||'Not recorded');
  return head('Bid management','Award / Win-Loss','Outcomes of every decided bid, with reasons for losses so the next bid learns from them.')+
  `<div class="grid g3">${kpi('Win rate',dec?Math.round(w.length/dec*100)+'%':'–',w.length+' won, '+lo.length+' lost','var(--s2)')}${kpi('Awarded value',cr(w.reduce((a,x)=>a+inr(x.outcome&&x.outcome.value||x.value,x.cur),0)),'Contract value of wins','var(--s6)')}${kpi('Awaiting outcome',cnt(t,'submitted'),'Submitted bids','var(--s7)')}</div>
  <div class="grid g2"><div class="card"><header><h2>Decided bids</h2></header>${table([{h:'Bid',f:tenderCell},{h:'Result',f:x=>pillStage(x.stage)},{h:'Date',f:x=>fmtD(x.outcome&&x.outcome.date)},{h:'Reason',f:x=>esc(x.outcome&&x.outcome.reason||'')}],w.concat(lo),'No decided bids yet. Record outcomes under Submission Tracking.')}</div><div class="card"><header><h2>Why bids were lost</h2></header>${hbars(why,null,()=>'var(--s8)')}</div></div>`;
};
ACT.outcome=id=>{const t=DB.tenders.find(x=>x.id===id);
  modal('Record outcome',`<div class="fg"><label>Result<select id="o_res"><option value="won">Won</option><option value="lost">Lost</option></select></label><label>Decision date<input id="o_date" type="date" value="${today()}"></label><label>Awarded value (${esc(t.cur)})<input id="o_val" type="number" value="${t.value||''}"></label><label>Reason or lesson<input id="o_why" placeholder="e.g. Price, technical score"></label></div>`,()=>{const r=$('#o_res').value;t.outcome={result:r,date:$('#o_date').value||today(),value:r==='won'?+$('#o_val').value||0:0,reason:$('#o_why').value.trim()};moveStage(t,r,t.outcome.reason);render();toast(r==='won'?'Marked won':'Marked lost')},'Save')};
V.post=()=>{
  const sub=T().filter(t=>t.stage==='submitted'),won=T().filter(t=>t.stage==='won');
  const hasP=t=>DB.projects.some(p=>p.tenderId===t.id);
  return head('Post submission & award','Post Submission & Award','Follow up on submitted bids and hand every win over to project delivery.')+
  `<div class="grid g2"><div class="card"><header><h2>Follow-up on submitted bids</h2></header>${table([{h:'Bid',f:tenderCell},{h:'Last follow-up',f:t=>fmtD(t.followDate)},{h:'Note',f:t=>`<input data-chg="fnote" data-id="${t.id}" value="${esc(t.followNote)}" placeholder="Add note" aria-label="Follow-up note">`},{h:'',f:t=>`<button class="btn sm" data-act="followed" data-id="${t.id}">Log today</button>`}],sub,'No submitted bids to chase.')}</div>
  <div class="card"><header><h2>Awards and handover</h2></header>${table([{h:'Award',f:tenderCell},{h:'Project',f:t=>hasP(t)?'<span class="pill good">Created</span>':'<span class="pill warn">Not created</span>'},{h:'',f:t=>hasP(t)?'':`<button class="btn sm pri" data-act="mkProject" data-id="${t.id}">Create project</button>`}],won,'No awards yet.')}</div></div>`;
};
CHG.fnote=(id,v)=>{const t=DB.tenders.find(x=>x.id===id);t.followNote=v;save()};
ACT.followed=id=>{DB.tenders.find(x=>x.id===id).followDate=today();save();render()};
ACT.mkProject=id=>{const t=DB.tenders.find(x=>x.id===id);const v=inr(t.outcome&&t.outcome.value||t.value,t.cur);
  const p=mkP(t.title,t.client,t.country,t.sector,t.owner||'',  'Mobilisation','Medium',v,0,0,365);p.sample=false;p.tenderId=t.id;p.milestones=[];p.invoices=[];p.pbgAmount=Math.round(v*0.05);
  DB.projects.push(p);save();toast('Project created');location.hash='#projects'};
/* ---------- CRM ---------- */
V.crm=()=>{
  const t=T(),names=[...new Set(t.map(x=>x.client).filter(Boolean))];
  const rows=names.map(n=>{const l=t.filter(x=>x.client===n),w=l.filter(x=>x.stage==='won').length,lo=l.filter(x=>x.stage==='lost').length;return{n,count:l.length,val:l.reduce((a,x)=>a+inr(x.value,x.cur),0),w,lo,c:DB.clients[n]||{}}}).sort((a,b)=>b.val-a.val);
  return head('Post submission & award','BD Opportunity & CRM','Every client with its opportunity history. Keep contact details and the last conversation next to the numbers.')+
  `<div class="card">${table([{h:'Client',f:r=>`<div class="t">${esc(r.n)}</div><small>${esc(r.c.contact||'No contact saved')}</small>`},{h:'Opps',num:1,f:r=>r.count},{h:'Pipeline value',num:1,f:r=>cr(r.val)},{h:'Won / Lost',num:1,f:r=>r.w+' / '+r.lo},{h:'Last touch',f:r=>fmtD(r.c.last)},{h:'Notes',f:r=>esc(r.c.notes||'')},{h:'',f:r=>`<button class="btn sm" data-act="editClient" data-id="${esc(r.n)}">Edit</button>`}],rows,'No clients yet. Add tenders to build the client list.')}</div>`;
};
ACT.editClient=n=>{const c=DB.clients[n]||{};
  modal('Client: '+n,`<div class="fg"><label class="w">Contact person, role, phone or email<input id="c_contact" value="${esc(c.contact)}"></label><label>Last conversation<input id="c_last" type="date" value="${esc(c.last)}"></label><label class="w">Notes<textarea id="c_notes" rows="3">${esc(c.notes)}</textarea></label></div>`,()=>{DB.clients[n]={contact:$('#c_contact').value.trim(),last:$('#c_last').value,notes:$('#c_notes').value.trim()};save();render()})};
/* ---------- Project & contract management ---------- */
let PF={status:'',country:''};
CHG.pfs=(_,v)=>{PF.status=v;render()};CHG.pfc=(_,v)=>{PF.country=v;render()};
const RISKC={Low:'good',Medium:'warn',High:'crit'},STC={'On Track':'good','At Risk':'warn',Delayed:'crit',Completed:'info',Mobilisation:''};
const allMs=()=>DB.projects.flatMap(p=>p.milestones.map(m=>({...m,p})));
const allInv=()=>DB.projects.flatMap(p=>p.invoices.map(i=>({...i,p})));
V.projects=()=>{
  const P=DB.projects.filter(p=>(!PF.status||p.status===PF.status)&&(!PF.country||p.country===PF.country));
  const act=P.filter(p=>p.status!=='Completed');
  const rec=P.reduce((a,p)=>a+p.invoices.filter(i=>!i.paid).reduce((b,i)=>b+i.amount,0),0);
  const overdueMs=allMs().filter(m=>!m.done&&daysTo(m.due)<0).length,pbg=DB.projects.filter(p=>daysTo(p.pbgExpiry)!=null&&daysTo(p.pbgExpiry)<=60).length,ovInv=allInv().filter(i=>!i.paid&&daysTo(i.due)<0).length,hi=DB.projects.filter(p=>p.risk==='High'&&p.status!=='Completed').length;
  const countries=[...new Set(DB.projects.map(p=>p.country))];
  return head('Project delivery & commercial control','Project Portfolio Dashboard',"A bird's-eye view of all IQT projects: status, delivery, financials and risk.")+
  `<div class="bar"><select data-chg="pfs" aria-label="Status"><option value="">All statuses</option>${opts(PSTAT,PF.status)}</select><select data-chg="pfc" aria-label="Country"><option value="">All countries</option>${opts(countries,PF.country)}</select><button class="btn pri sp" data-act="newProject">New project</button></div>
  <div class="grid g6">${kpi('Total projects',P.length,'In this view','var(--s1)')}${kpi('Active projects',act.length,'Not completed','var(--s3)')}${kpi('Delayed',P.filter(p=>p.status==='Delayed').length,'Past plan','var(--s8)')}${kpi('On track',P.filter(p=>p.status==='On Track').length,'To plan','var(--s6)')}${kpi('Contract value',cr(P.reduce((a,p)=>a+p.value,0)),'INR','var(--s7)')}${kpi('Outstanding receivables',cr(rec),'Unpaid invoices','var(--s4)')}</div>
  <div class="grid g3"><div class="card"><header><h2>Projects by status</h2></header>${hbars(PSTAT.map(s=>[s,P.filter(p=>p.status===s).length]),null,i=>PAL[[0,5,3,7,6][i]])}</div><div class="card"><header><h2>Project risk level</h2></header>${donut(['Low','Medium','High'].map(r=>[r,P.filter(p=>p.risk===r).length]).filter(x=>x[1]),P.length,'projects',['var(--s3)','var(--s4)','var(--s8)'])}</div>
  <div class="card"><header><h2>Key alerts and actions</h2></header>${[['Overdue deliverables',overdueMs,'contracts'],['PBG expiring in 60 days',pbg,'finance'],['Invoices overdue',ovInv,'finance'],['Open high-risk projects',hi,'projects']].map(a=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><a href="#${a[2]}">${a[0]}</a><span class="pill ${a[1]?'crit':'good'}">${a[1]}</span></div>`).join('')}</div></div>
  <div class="card"><header><h2>Project Portfolio Register</h2><small>${P.length} projects</small></header>${table([{h:'Project',f:p=>`<div class="t">${esc(p.name)}</div><small>${esc(p.client)}</small>`},{h:'Country',f:p=>esc(p.country)},{h:'Owner',f:p=>esc(p.owner)},{h:'Dates',f:p=>fmtD(p.start)+'<small>to '+fmtD(p.end)+'</small>'},{h:'Progress',f:p=>`<div class="prog"><i style="width:${p.progress}%"></i></div><small>${p.progress}%</small>`},{h:'Status',f:p=>`<span class="pill ${STC[p.status]}">${p.status}</span>`},{h:'Risk',f:p=>`<span class="pill ${RISKC[p.risk]}">${p.risk}</span>`},{h:'Value',num:1,f:p=>cr(p.value)},{h:'',f:p=>`<button class="btn sm" data-act="editProject" data-id="${p.id}">Edit</button> <button class="btn sm danger" data-act="delProject" data-id="${p.id}">Delete</button>`}],P,'No projects yet. Create one here or from a won bid.')}</div>`;
};
function projForm(p){p=p||{};return `<div class="fg"><label class="w">Project name<input id="p_name" value="${esc(p.name)}"></label><label>Client<input id="p_client" value="${esc(p.client)}"></label><label>Country<input id="p_country" value="${esc(p.country)}"></label><label>Sector<select id="p_sector">${opts(SECTORS,p.sector)}</select></label><label>Owner<input id="p_owner" value="${esc(p.owner)}"></label><label>Start<input id="p_start" type="date" value="${esc(p.start||today())}"></label><label>End<input id="p_end" type="date" value="${esc(p.end||dd(today(),365))}"></label><label>Status<select id="p_status">${opts(PSTAT,p.status||'Mobilisation')}</select></label><label>Risk<select id="p_risk">${opts(['Low','Medium','High'],p.risk||'Low')}</select></label><label>Contract value (INR)<input id="p_value" type="number" value="${esc(p.value||'')}"></label><label>Progress %<input id="p_prog" type="number" min="0" max="100" value="${esc(p.progress||0)}"></label><label>PBG amount (INR)<input id="p_pbg" type="number" value="${esc(p.pbgAmount||'')}"></label><label>PBG expiry<input id="p_pbgd" type="date" value="${esc(p.pbgExpiry)}"></label></div>`}
function readProj(p){const g=i=>$('#p_'+i).value.trim();if(!g('name')){toast('Add a project name');return false}
  Object.assign(p,{name:g('name'),client:g('client'),country:g('country'),sector:g('sector'),owner:g('owner'),start:g('start'),end:g('end'),status:g('status'),risk:g('risk'),value:+g('value')||0,progress:Math.min(100,Math.max(0,+g('prog')||0)),pbgAmount:+g('pbg')||0,pbgExpiry:g('pbgd')});return true}
ACT.newProject=()=>modal('New project',projForm(),()=>{const p={id:uid('P'),milestones:[],invoices:[]};if(!readProj(p))return false;DB.projects.push(p);save();render()});
ACT.editProject=id=>{const p=DB.projects.find(x=>x.id===id);modal('Edit project',projForm(p),()=>{if(!readProj(p))return false;save();render()})};
ACT.delProject=id=>confirmBox('Delete this project with its milestones and invoices?',()=>{DB.projects=DB.projects.filter(p=>p.id!==id);save();render()},'Delete');
V.contracts=()=>{
  const l=allMs().sort((a,b)=>a.due.localeCompare(b.due));
  return head('Project & contract management','Milestones & Deliverables','Every contract deliverable across projects, earliest due date first.')+
  `<div class="bar"><button class="btn pri" data-act="addMs">Add milestone</button><span class="sp" style="color:var(--muted)">${l.filter(m=>!m.done).length} open, ${l.filter(m=>!m.done&&daysTo(m.due)<0).length} overdue</span></div><div class="card">${table([{h:'Deliverable',f:m=>`<div class="t">${esc(m.name)}</div><small>${esc(m.p.name)}</small>`},{h:'Due',f:m=>fmtD(m.due)},{h:'Status',f:m=>m.done?'<span class="pill good">Done</span>':pillDue(m.due)},{h:'',f:m=>`<button class="btn sm" data-act="togMs" data-id="${m.id}">${m.done?'Reopen':'Mark done'}</button>`}],l,'No milestones yet.')}</div>`;
};
ACT.togMs=id=>{DB.projects.forEach(p=>p.milestones.forEach(m=>{if(m.id===id)m.done=!m.done}));save();render()};
ACT.addMs=()=>{if(!DB.projects.length){toast('Create a project first');return}
  modal('Add milestone',`<div class="fg"><label class="w">Project<select id="m_p">${DB.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>Deliverable<input id="m_n"></label><label>Due<input id="m_d" type="date" value="${dd(today(),30)}"></label></div>`,()=>{const n=$('#m_n').value.trim();if(!n){toast('Name the deliverable');return false}DB.projects.find(p=>p.id===$('#m_p').value).milestones.push({id:uid('M'),name:n,due:$('#m_d').value,done:false});save();render()})};
V.finance=()=>{
  const inv=allInv().sort((a,b)=>a.due.localeCompare(b.due)),open=inv.filter(i=>!i.paid);
  return head('Project & contract management','Financials & PBG','Invoices raised against each contract, and the performance bank guarantee that backs it.')+
  `<div class="grid g3">${kpi('Receivable',cr(open.reduce((a,i)=>a+i.amount,0)),open.length+' unpaid invoices','var(--s4)')}${kpi('Overdue',cr(open.filter(i=>daysTo(i.due)<0).reduce((a,i)=>a+i.amount,0)),open.filter(i=>daysTo(i.due)<0).length+' invoices past due','var(--s8)')}${kpi('Collected',cr(inv.filter(i=>i.paid).reduce((a,i)=>a+i.amount,0)),'Paid invoices','var(--s6)')}</div>
  <div class="grid g2"><div class="card"><header><h2>Invoices</h2><button class="btn sm pri" data-act="addInv">Add invoice</button></header>${table([{h:'Invoice',f:i=>`<div class="t">${esc(i.no)}</div><small>${esc(i.p.name)}</small>`},{h:'Amount',num:1,f:i=>cr(i.amount)},{h:'Due',f:i=>i.paid?'<span class="pill good">Paid</span>':fmtD(i.due)+'<br>'+pillDue(i.due)},{h:'',f:i=>`<button class="btn sm" data-act="togInv" data-id="${i.id}">${i.paid?'Unmark':'Mark paid'}</button>`}],inv,'No invoices yet.')}</div>
  <div class="card"><header><h2>Performance bank guarantees</h2></header>${table([{h:'Project',f:p=>esc(p.name)},{h:'Amount',num:1,f:p=>p.pbgAmount?cr(p.pbgAmount):'–'},{h:'Expiry',f:p=>fmtD(p.pbgExpiry)+'<br>'+pillDue(p.pbgExpiry)}],DB.projects.slice().sort((a,b)=>(a.pbgExpiry||'9').localeCompare(b.pbgExpiry||'9')),'No projects yet.')}</div></div>`;
};
ACT.togInv=id=>{DB.projects.forEach(p=>p.invoices.forEach(i=>{if(i.id===id)i.paid=!i.paid}));save();render()};
ACT.addInv=()=>{if(!DB.projects.length){toast('Create a project first');return}
  modal('Add invoice',`<div class="fg"><label class="w">Project<select id="i_p">${DB.projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label>Invoice no.<input id="i_n"></label><label>Amount (INR)<input id="i_a" type="number"></label><label>Due<input id="i_d" type="date" value="${dd(today(),30)}"></label></div>`,()=>{const a=+$('#i_a').value;if(!$('#i_n').value.trim()||!a){toast('Add an invoice number and amount');return false}DB.projects.find(p=>p.id===$('#i_p').value).invoices.push({id:uid('I'),no:$('#i_n').value.trim(),amount:a,due:$('#i_d').value,paid:false});save();render()})};
/* ---------- MIS ---------- */
V.mis=()=>{
  const t=T();
  const steps=STAGES.slice(1).map((s,i)=>{const a=reached(t,i),b=reached(t,i+1);return[STAGES[i].n+' → '+s.n,a?Math.round(b/a*100):0,(a?Math.round(b/a*100):0)+'%']});
  const sec=SECTORS.map(s=>{const l=t.filter(x=>x.sector===s),w=l.filter(x=>x.stage==='won').length,d=w+l.filter(x=>x.stage==='lost').length;return[s,l.length,l.length+(d?' · win '+Math.round(w/d*100)+'%':'')]}).filter(x=>x[1]).sort((a,b)=>b[1]-a[1]);
  return head('Management MIS & BI','Management MIS & BI','Conversion, performance and pipeline value for the selected financial year.')+
  `<div class="grid g2"><div class="card"><header><h2>Stage-to-stage conversion</h2></header>${hbars(steps,100,i=>PAL[i%8])}</div><div class="card"><header><h2>BD performance trend</h2></header>${monthly(t)}</div></div>
  <div class="grid g2"><div class="card"><header><h2>Opportunities and win rate by sector</h2></header>${hbars(sec,null,i=>PAL[i%8])}</div><div class="card"><header><h2>Value by stage (INR)</h2></header>${hbars(STAGES.map((s,i)=>{const v=t.filter(x=>x.stage===s.k).reduce((a,x)=>a+inr(x.value,x.cur),0);return[s.n,v,cr(v)]}),null,i=>PAL[i%8])}</div></div>
  <div class="bar"><button class="btn" data-act="csvOut">Export tender register as CSV</button></div>`;
};
ACT.csvOut=()=>{const h=['title','client','country','region','sector','source','url','value','currency','deadline','captured','stage','owner'];
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  showExport('Tender register (CSV)',[h.join(',')].concat(DB.tenders.map(t=>[t.title,t.client,t.country,t.region,t.sector,t.source,t.url,t.value,t.cur,t.deadline,t.captured,t.stage,t.owner].map(q).join(','))).join('\n'),'iqt-tenders.csv','text/csv')};
/* ---------- QA ---------- */
V.qa=()=>{
  const t=DB.tenders,act=t.filter(x=>!['won','lost','nogo','rejected'].includes(x.stage));
  const key=x=>(x.title+'|'+x.client).toLowerCase(),seen={},dups=[];t.forEach(x=>{if(seen[key(x)])dups.push(x);else seen[key(x)]=1});
  const sum=ALLST.reduce((a,s)=>a+cnt(t,s.k),0);
  const checks=[
   ['Stage counts add up to the register total',sum===t.length?[]:[{title:`Stages total ${sum}, register holds ${t.length}`}],'Every tender has exactly one valid stage.'],
   ['Stage history agrees with current stage',t.filter(x=>SIDX[x.stage]!=null&&(x.reached||0)<SIDX[x.stage]),'The funnel counts from history, so a mismatch would distort it.'],
   ['Verified records have a source link',t.filter(x=>SIDX[x.stage]>=1&&!x.url),'Add the official notice link to keep evidence auditable.'],
   ['Sector classified',t.filter(x=>x.sector==='Unclassified'),'Classify in Opportunity Identified so sector reports stay meaningful.'],
   ['No duplicate tenders',dups,'Same title and client appears twice.'],
   ['Open tenders past their deadline',act.filter(x=>daysTo(x.deadline)!=null&&daysTo(x.deadline)<0),'Reject or close these so the pipeline shows live work only.'],
   ['Estimated value present',act.filter(x=>!x.value),'Pipeline value is understated without it.'],
   ['Submitted bids have a submission record',t.filter(x=>x.stage==='submitted'&&!x.submission),'Record the date and reference.'],
   ['Wins handed over to a project',t.filter(x=>x.stage==='won'&&!DB.projects.some(p=>p.tenderId===x.id)),'Create the project in Post Submission & Award.'],
   ['Projects have PBG expiry',DB.projects.filter(p=>!p.pbgExpiry),'Without it expiry alerts cannot fire.']];
  const bad=checks.filter(c=>c[1].length).length;
  return head('Management MIS & BI','QA Control Centre','Automatic data-quality checks. Each failing check lists the records to fix.')+
  `<div class="grid g3">${kpi('Checks passing',(checks.length-bad)+' / '+checks.length,'Run on every view','var(--s3)')}${kpi('Open issues',checks.reduce((a,c)=>a+c[1].length,0),'Records needing attention','var(--s8)')}${kpi('Register total',t.length,'All financial years','var(--s1)')}</div>
  <div class="card">${checks.map(c=>`<details style="padding:9px 0;border-bottom:1px solid var(--line)"><summary style="cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none"><span class="pill ${c[1].length?'crit':'good'}">${c[1].length?c[1].length+' to fix':'Pass'}</span><b>${esc(c[0])}</b></summary><p style="color:var(--muted);margin:8px 0 4px">${esc(c[2])}</p>${c[1].slice(0,6).map(x=>`<div style="font-size:12.5px;padding:2px 0">• ${esc(x.title||x.name)}</div>`).join('')}${c[1].length>6?`<small style="color:var(--muted)">and ${c[1].length-6} more</small>`:''}</details>`).join('')}</div>`;
};
/* ---------- Data & settings ---------- */
CHG.fx=(k,v)=>{DB.fx[k]=+v||DB.fx[k];save()};
CHG.fy=(_,v)=>{DB.fy=v;save();render()};
V.data=()=>head('Management MIS & BI','Data & Settings',(SERVER?'Everything is saved to a file on this PC (data/db.json), with a daily backup kept for 14 days. Export a copy now and then to store elsewhere.':'Your decisions, notes and projects stay in this browser. Export a backup regularly, because clearing browser data removes it.'))+
 `<div class="card" style="margin-bottom:14px"><header><h2>Live tender feed</h2><small>Last update ${esc(ago(DB.feedAt))}</small></header><div class="bar"><label for="feedUrl" style="color:var(--muted);font-size:12px">Feed address</label><input id="feedUrl" data-chg="feedUrl" value="${esc(DB.feedUrl)}" style="flex:1;min-width:260px"><button class="btn" data-act="syncNow">Refresh now</button></div><p style="color:var(--muted);margin:0 0 8px">New tenders are added as Captured and checked every 15 minutes while this page is open. Your own edits are never overwritten.</p>${table([{h:'Source',f:s=>esc(s.name)},{h:'Status',f:s=>`<span class="pill ${s.status==='OK'?'good':s.status==='ERROR'?'crit':s.status==='EMPTY'?'warn':''}">${esc(s.status||'')}</span>`},{h:'Last count',num:1,f:s=>s.lastCount==null?'–':s.lastCount},{h:'Last success',f:s=>esc(ago(s.lastOk))},{h:'Problem',f:s=>esc(s.error||s.note||'')}],DB.feedSources||[],'No capture run has reported yet. The first scheduled run fills this table in.')}</div>
 <div class="grid g2"><div class="card"><header><h2>Exchange rates to INR</h2></header><p style="color:var(--muted);margin:0 0 8px">Used for every value shown in INR. Set the rates you use for reporting.</p>${Object.keys(DB.fx).map(k=>`<div class="rng" style="grid-template-columns:60px 1fr"><label for="fx_${k}">${k}</label><input id="fx_${k}" type="number" step="0.01" min="0" value="${DB.fx[k]}" data-chg="fx" data-id="${k}"${k==='INR'?' disabled':''}></div>`).join('')}</div>
 <div class="card"><header><h2>Backup and restore</h2></header><div class="bar"><button class="btn pri" data-act="expJSON">Export full backup</button><button class="btn" data-act="impJSON">Restore from backup</button></div><div class="bar"><button class="btn" data-act="loadSample">Load sample data</button><button class="btn danger" data-act="wipe">Delete all data</button></div></div></div>`;
function showExport(title,text,fname,mime){
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime}));a.download=fname;document.body.appendChild(a);a.click();a.remove()}catch(e){}
  modal(title,`<p style="color:var(--muted);margin:6px 0">If no file was downloaded, copy the text below and save it as <b>${esc(fname)}</b>.</p><textarea id="expT" rows="9" readonly style="font:12px var(--mono)">${esc(text)}</textarea>`,()=>{const el=$('#expT');el.select();try{navigator.clipboard.writeText(text).then(()=>toast('Copied'),()=>{document.execCommand&&document.execCommand('copy')})}catch(e){}return false},'Copy to clipboard');
}
ACT.expJSON=()=>showExport('Full backup (JSON)',JSON.stringify(DB,null,1),'iqt-bd-pms-backup.json','application/json');
$('#exportBtn').onclick=ACT.expJSON;
ACT.impJSON=()=>modal('Restore from backup',`<p style="color:var(--muted);margin:6px 0">Choose a backup file or paste its text. This replaces all current data.</p><input type="file" id="bkF" accept=".json"><textarea id="bkT" rows="5"></textarea>`,()=>{
  const apply=s=>{try{const d=JSON.parse(s);if(!Array.isArray(d.tenders))throw 0;DB=Object.assign(defaults(),d);save();render();toast('Backup restored')}catch(e){toast('That is not a valid backup file')}};
  const f=$('#bkF').files[0];if(f){const r=new FileReader();r.onload=()=>apply(r.result);r.readAsText(f)}else if($('#bkT').value.trim())apply($('#bkT').value);else{toast('Choose a file or paste text');return false}},'Restore');
ACT.loadSample=()=>confirmBox('Replace everything with illustrative sample data?',()=>{DB=defaults();seed();save();render()},'Load sample');
ACT.wipe=()=>confirmBox('Delete every tender, project and setting? Export a backup first if unsure.',()=>{DB=defaults();save();render()},'Delete everything');
/* ---------- live feed ---------- */
const keyOf=(t,c)=>{const n=s=>String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();return n(t).slice(0,120)+'|'+n(c).slice(0,60)};
const ago=iso=>{if(!iso)return 'never';const m=Math.round((Date.now()-new Date(iso))/6e4);return m<2?'just now':m<90?m+' min ago':m<2880?Math.round(m/60)+' h ago':Math.round(m/1440)+' days ago'};
let feedBusy=false;
async function syncFeed(manual){
  const url=(DB.feedUrl||'').trim(),el=$('#feedStat');
  if(!url){el.textContent='Feed: not set';return false}
  if(DB.sample){el.textContent='Feed paused while sample data is loaded';return false}
  if(feedBusy)return false;feedBusy=true;let ok=false;
  try{
    const r=await fetch(url+(url.includes('?')?'&':'?')+'t='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const f=await r.json();ok=true;
    const have=new Map(DB.tenders.map(t=>[keyOf(t.title,t.client),t]));let add=0;
    for(const it of f.items||[]){
      const k=keyOf(it.title,it.client),old=have.get(k);
      if(old){if(!old.url&&it.url)old.url=it.url;if(!old.deadline&&it.deadline)old.deadline=it.deadline;if(!old.value&&it.value){old.value=it.value;old.cur=it.cur}if(!old.rel&&it.rel)old.rel=it.rel;continue}
      if(DB.deleted[k])continue;
      const t={id:it.id||uid('T'),title:it.title,client:it.client||'',country:it.country||'',region:it.region||'Other',sector:it.sector||'Unclassified',source:it.source||'',url:it.url||'',value:it.value||0,cur:it.cur||'INR',deadline:it.deadline||'',captured:(it.firstSeen||'').slice(0,10)||today(),stage:'captured',reached:0,owner:'',notes:'',rel:it.rel||'',type:it.type||'',ref:it.ref||'',history:[{at:new Date().toISOString(),from:'',to:'captured',note:'Captured by feed'}]};
      DB.tenders.push(t);have.set(k,t);add++;
    }
    DB.feedAt=f.generated||'';DB.feedSources=f.sources||[];save();
    el.textContent='Feed: '+(add?add+' new, ':'')+'updated '+ago(DB.feedAt);
    if(add){toast(add+' new tenders captured');render()}else{if(cur==='data')render();if(manual)toast('Already up to date')}
  }catch(e){el.textContent='Feed: not reachable';if(manual)toast('Could not reach the feed. Check the address in Data & Settings.')}
  feedBusy=false;return ok;
}
ACT.syncNow=async()=>{if(SERVER){toast('Checking all sources. This can take a minute.');try{await fetch('api/capture',{method:'POST'})}catch(e){}}syncFeed(true)};
async function serverInit(){try{const r=await fetch('api/db',{cache:'no-store'});if(!r.ok)return;SERVER=true;const d=await r.json();if(d&&Array.isArray(d.tenders)){DB=Object.assign(defaults(),d);FRESH=false}else if(!FRESH)pushServer()}catch(e){}}
CHG.feedUrl=(_,v)=>{DB.feedUrl=v.trim();save();syncFeed(true)};
/* ---------- boot ---------- */
function applyTheme(m){if(m)document.documentElement.setAttribute('data-theme',m);else document.documentElement.removeAttribute('data-theme')}
try{applyTheme(localStorage.getItem(KEY+'-theme'))}catch(e){}
$('#themeBtn').onclick=()=>{const dark=document.documentElement.getAttribute('data-theme')==='dark'||(!document.documentElement.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);const m=dark?'light':'dark';applyTheme(m);try{localStorage.setItem(KEY+'-theme',m)}catch(e){}};
$('#menuBtn').onclick=()=>document.body.classList.toggle('nav-open');
load();
$('#fy').innerHTML=['2025-26','2026-27','2027-28'].map(y=>`<option value="${y}"${y===DB.fy?' selected':''}>FY ${y}</option>`).join('');
$('#fy').onchange=e=>{DB.fy=e.target.value;save();render()};
(async()=>{
  await serverInit();
  if(FRESH){await syncFeed();if(!DB.tenders.length){seed();save()}}
  route();
  syncFeed();
  setInterval(()=>syncFeed(),15*60*1000);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncFeed()});
})();
</script>
</body></html>
